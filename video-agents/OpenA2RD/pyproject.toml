[project]
name = "open-a2rd"
version = "0.1.0"
description = "Open-source replication of A²RD: Agentic Autoregressive Diffusion for Long Video Consistency"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.60.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "torch>=2.0",
    "transformers>=4.40",
    "open-clip-torch>=2.24",
]
local = [
    "diffusers>=0.30",
    "accelerate>=0.30",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4",
]
